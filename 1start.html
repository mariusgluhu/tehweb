<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Acasă - Nissan Hub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            color: #f4f4f4;
            position: relative;
            min-height: 100vh;
            background-color: #121212;
            overflow: hidden;
        }

        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('image/logo.jpg') no-repeat center center fixed;
            background-size: cover;
            filter: blur(3px) grayscale(50%);
            z-index: -1;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 34px 50px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
            border-bottom: 2px solid #006ef5;
        }

        h1 {
            margin: 0;
            font-size: 36px;
            color: #006ef5;
            font-weight: bold;
            letter-spacing: 2px;
        }

        nav ul {
            list-style: none;
            padding: 0;
            display: flex;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            position: relative;
            transition: color 0.3s ease, transform 0.3s ease;
            padding: 5px 10px;
        }

        nav a::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 2px;
            background-color: #006ef5;
            bottom: -3px;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            transform-origin: center;
            transition: transform 0.3s ease-out;
        }

        nav a:hover {
            color: #006ef5;
            transform: scale(1.1);
        }

        nav a:hover::after {
            transform: translateX(-50%) scaleX(1);
        }

        nav a.active::after {
            transform: translateX(-50%) scaleX(1);
        }

        main {
            width: 80%;
            max-width: 1000px;
            margin: 60px auto;
            padding: 30px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(7px);
            text-align: center;
        }

        section {
            padding: 25px;
            margin-bottom: 40px;
            background-color: rgba(0, 0, 0, 0.6);
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        section:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        section h2 {
            color: #006ef5;
            font-size: 28px;
            margin-top: 0;
            letter-spacing: 1px;
        }

        .cta {
            display: inline-block;
            margin-top: 15px;
            padding: 15px 30px;
            background-color: #006ef5;
            color: white;
            border-radius: 50px;
            text-decoration: none;
            border: 2px solid #006ef5;
            transition: all 0.3s ease;
            font-size: 18px;
        }

        .cta:hover {
            background-color: #2e86f1;
            transform: scale(1.05);
        }

        footer {
            text-align: center;
            padding: 20px 0;
            background-color: rgba(0, 0, 0, 0.7);
            color: #f4f4f4;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="background"></div>

    <header>
        <h1>Nissan Hub</h1>
        <nav>
            <ul>
                <li><a href="1start.html" class="active">Acasă</a></li>
                <li><a href="2page.html">Despre</a></li>
                <li><a href="3page.html">Modele</a></li>
                <li><a href="4page.html">Servicii</a></li>
                <li><a href="5page.html">Galerie</a></li>
                <li><a href="6page.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h2>Descoperă viitorul mobilității</h2>
            <a href="3page.html" class="cta">Vezi Modele</a>
        </section>
        <section>
            <h2>„Inovație. Putere. Libertate pe drum.” – Nissan</h2>
        </section>
    </main>

    <footer>
    </footer>
</body>
</html>
