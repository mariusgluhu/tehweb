<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Galerie - Nissan Hub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: black;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 37px 50px;
            background-color: rgb(14, 14, 14);
            color: white;
            position: relative;
            z-index: 10;
            border-bottom: 2px solid #ffc800; /* Linie de separare între header și conținut */

        }

        h1 {
            margin: 0;
            font-size: 36px;
            color: #ffc800;
            font-weight: bold;
            letter-spacing: 2px;
        }

        nav ul {
            list-style: none;
            padding: 0;
            display: flex;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            position: relative;
            padding: 5px 10px;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        /* Linie animată sub link - din centru spre exterior */
        nav a::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            transform-origin: center;
            width: 100%;
            height: 2px;
            background-color: #ffc800;
            transition: transform 0.3s ease;
        }

        nav a:hover {
            color: #ffc800;
            transform: scale(1.1);
        }

        nav a:hover::after {
            transform: translateX(-50%) scaleX(1);
        }

        nav a.active::after {
            transform: translateX(-50%) scaleX(1);
        }

        .background-gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            width: 100vw;
            height: 100vh;
            padding: 10px;
            background-color: black;
            margin-top: 50px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

        .gallery-item:nth-child(1) {
            grid-column: span 2;
            grid-row: span 2;
        }

        .gallery-item:nth-child(2) {
            grid-column: span 1;
            grid-row: span 1;
        }

        .gallery-item:nth-child(3) {
            grid-column: span 1;
            grid-row: span 2;
        }

        .gallery-item:nth-child(4) {
            grid-column: span 1;
            grid-row: span 1;
        }

        .gallery-item:nth-child(5) {
            grid-column: span 1;
            grid-row: span 1;
        }

        .gallery-item:nth-child(6) {
            grid-column: span 2;
            grid-row: span 1;
        }

        .gallery-item:nth-child(7) {
            grid-column: span 1;
            grid-row: span 1;
        }

        .gallery-item:nth-child(8) {
            grid-column: span 1;
            grid-row: span 2;
        }

        .image-title {
            position: absolute;
            bottom: 10px;
            left: 15px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Nissan Hub</h1>
        <nav>
            <ul>
                <li><a href="1start.html">Acasă</a></li>
                <li><a href="2page.html">Despre</a></li>
                <li><a href="3page.html">Modele</a></li>
                <li><a href="4page.html">Servicii</a></li>
                <li><a href="5page.html" class="active">Galerie</a></li>
                <li><a href="6page.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="background-gallery">
        <div class="gallery-item">
            <img src="gtr2.jpg" alt="Nissan 1">
            <div class="image-title">Nissan GT-R</div>
        </div>
        <div class="gallery-item">
            <img src="altima.jpg" alt="Nissan 2">
            <div class="image-title">Nissan Altima</div>
        </div>
        <div class="gallery-item">
            <img src="leaf2.jpg" alt="Nissan 3">
            <div class="image-title">Nissan Leaf</div>
        </div>
        <div class="gallery-item">
            <img src="juke2.jpeg" alt="Nissan 4">
            <div class="image-title">Nissan Juke</div>
        </div>
        <div class="gallery-item">
            <img src="qashqai2.jpg" alt="Nissan 5">
            <div class="image-title">Nissan Qashqai</div>
        </div>
        <div class="gallery-item">
            <img src="patrol.jpg" alt="Nissan 6">
            <div class="image-title">Nissan Patrol</div>
        </div>
        <div class="gallery-item">
            <img src="xtrail2.jpg" alt="Nissan 7">
            <div class="image-title">Nissan X-Trail</div>
        </div>
    </div>

</body>
</html>
